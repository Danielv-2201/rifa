<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifa · Panel de boletas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-2:#F1E9D8;
    --stub:#ECE0C8;
    --ink:#211D17;
    --ink-soft:#6B6255;
    --line: rgba(33,29,23,0.20);
    --red:#A3311F;
    --red-soft:#F3DAD3;
    --gold:#B9862E;
    --gold-soft:#F3E4C2;
    --green:#3B6B4C;
    --green-soft:#DCE9DD;
    --white:#FFFFFF;
    --shadow: 0 14px 34px rgba(33,29,23,0.14);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B1712;
      --paper-2:#241F18;
      --stub:#2B2419;
      --ink:#F3ECDD;
      --ink-soft:#BDB09B;
      --line: rgba(243,236,221,0.20);
      --red-soft:#3A2420;
      --gold-soft:#3A2F19;
      --green-soft:#1F2E24;
      --white:#241F18;
      --shadow: 0 14px 34px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B1712;
    --paper-2:#241F18;
    --stub:#2B2419;
    --ink:#F3ECDD;
    --ink-soft:#BDB09B;
    --line: rgba(243,236,221,0.20);
    --red-soft:#3A2420;
    --gold-soft:#3A2F19;
    --green-soft:#1F2E24;
    --white:#241F18;
    --shadow: 0 14px 34px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.01em;}
  #app{max-width:1040px; margin:0 auto; padding:20px 18px 80px;}

  /* ---------- header ---------- */
  .hero{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    padding:22px 22px 20px; background:var(--paper-2); border-radius:20px; border:1px solid var(--line);
    flex-wrap:wrap;
  }
  .hero-brand{display:flex; flex-direction:column; gap:2px;}
  .hero-brand .word{font-size:44px; line-height:0.85; color:var(--ink);}
  .hero-brand .sub{font-size:12.5px; color:var(--ink-soft); max-width:280px; line-height:1.5;}
  .hero-prices{display:flex; gap:22px; flex-wrap:wrap;}
  .price-block{min-width:120px;}
  .price-block .label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:2px;}
  .price-block .amount{font-family:'Anton',sans-serif; font-size:22px;}
  .price-block.premio .amount{color:var(--gold);}
  .edit-settings{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    width:34px; height:34px; border-radius:10px; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .edit-settings:hover{color:var(--ink); border-color:var(--ink-soft);}

  /* ---------- stats + legend ---------- */
  .board-head{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    margin:26px 0 14px;
  }
  .board-title{font-family:'Anton',sans-serif; font-size:20px;}
  .stats{display:flex; gap:8px; flex-wrap:wrap;}
  .stat-chip{
    font-size:12px; padding:6px 10px; border-radius:100px; border:1px solid var(--line);
    display:flex; align-items:center; gap:6px; color:var(--ink-soft);
  }
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dot.available{background:var(--paper); border:1.5px solid var(--ink-soft);}
  .dot.pending{background:var(--gold);}
  .dot.paid{background:var(--green);}

  /* ---------- grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(50px,1fr)); gap:8px;
  }
  .cell{
    aspect-ratio:1/1; border-radius:10px; border:1.5px dashed var(--ink-soft);
    background:var(--paper); color:var(--ink); font-family:'Anton',sans-serif; font-size:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease; position:relative;
  }
  .cell:hover{transform:translateY(-2px); box-shadow:var(--shadow);}
  .cell:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .cell.pending{background:var(--gold-soft); border-style:solid; border-color:var(--gold);}
  .cell.paid{background:var(--green-soft); border-style:solid; border-color:var(--green); color:var(--green);}
  .cell.pending{color:var(--gold);}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,17,12,0.5); display:none;
    align-items:flex-end; justify-content:center; z-index:50; padding:0;
  }
  .overlay.open{display:flex;}
  @media (min-width:640px){ .overlay{align-items:center; padding:24px;} }
  .modal{
    background:var(--paper); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:24px 22px 28px; box-shadow:var(--shadow);
    border:1px solid var(--line); border-bottom:none;
  }
  @media (min-width:640px){ .modal{border-radius:20px; border-bottom:1px solid var(--line);} }
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .modal-head h2{font-family:'Anton',sans-serif; font-weight:400; font-size:22px; margin:0;}
  .close-btn{
    border:none; background:var(--paper-2); width:32px; height:32px; border-radius:50%;
    color:var(--ink-soft); cursor:pointer; font-size:16px; flex-shrink:0;
  }

  /* ---------- form ---------- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
  .field input, .field select{
    width:100%; padding:12px 13px; border-radius:11px; border:1.5px solid var(--line);
    background:var(--paper-2); color:var(--ink); font-family:'Inter',sans-serif; font-size:15px;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--ink-soft);}
  .pay-toggle{display:flex; gap:8px;}
  .pay-toggle button{
    flex:1; padding:11px; border-radius:11px; border:1.5px solid var(--line); background:var(--paper-2);
    color:var(--ink-soft); font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .pay-toggle button.active[data-val="no"]{background:var(--gold-soft); border-color:var(--gold); color:var(--gold);}
  .pay-toggle button.active[data-val="si"]{background:var(--green-soft); border-color:var(--green); color:var(--green);}
  .actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}
  .btn{
    flex:1; padding:13px 16px; border-radius:12px; border:none; font-family:'Inter',sans-serif;
    font-size:14.5px; font-weight:700; cursor:pointer; text-align:center; min-width:140px;
  }
  .btn.primary{background:var(--ink); color:var(--paper);}
  .btn.ghost{background:var(--paper-2); color:var(--ink); border:1.5px solid var(--line);}
  .btn.danger{background:var(--red-soft); color:var(--red);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .helper-msg{font-size:12px; color:var(--ink-soft); margin-top:10px; text-align:center;}

  /* ---------- ticket preview ---------- */
  .ticket-wrap{display:flex; justify-content:center; padding:4px 0 2px;}
  .ticket-card{
    display:flex; background:var(--paper); border-radius:10px; overflow:hidden;
    box-shadow:var(--shadow); position:relative; border:1px solid var(--line);
    width:100%; max-width:480px;
  }
  /* section 1 — datos de la rifa */
  .sec-info{
    width:38%; flex-shrink:0; padding:14px 12px 12px 14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0;
  }
  .ticket-brand{font-size:44px; line-height:0.85; margin:0; text-align:center;}
  .ticket-meta{font-size:8.5px; color:var(--ink-soft); line-height:1.55; text-align:center; margin-top:12px;}
  .ticket-meta .rule{border:none; border-top:1px solid var(--line); margin:5px 0;}
  /* section 2 — valores */
  .sec-prices{
    flex:1; min-width:0; padding:14px 10px; border-left:1px solid var(--line);
    display:flex; flex-direction:column; justify-content:center; gap:12px; text-align:center;
  }
  .sec-prices .label{font-size:8px; letter-spacing:0.07em; color:var(--ink-soft); margin-bottom:2px;}
  .sec-prices .amount{font-family:'Anton',sans-serif; font-size:19px; line-height:1;}
  .sec-prices .premio .amount{color:var(--gold); font-size:21px;}
  /* section 3 — comprador */
  .ticket-divider{width:0; border-left:2px dashed var(--ink-soft); margin:10px 0; flex-shrink:0;}
  .sec-stub{
    width:33%; flex-shrink:0; background:var(--stub); padding:12px 11px 10px;
    display:flex; flex-direction:column; gap:6px; min-width:0;
  }
  .barcode{
    height:20px; opacity:0.85; border-radius:1px; flex-shrink:0;
    background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 10px, transparent 10px 13px);
  }
  .stub-label{font-size:7.5px; letter-spacing:0.07em; color:var(--ink-soft); margin-bottom:1px;}
  .stub-value{font-size:11px; font-weight:700; line-height:1.25; word-break:break-word;}
  .stub-status{
    font-size:8px; font-weight:800; letter-spacing:0.05em; padding:2px 7px; border-radius:100px;
    display:inline-block; width:fit-content;
  }
  .stub-status.no{background:var(--gold-soft); color:var(--gold);}
  .stub-status.si{background:var(--green-soft); color:var(--green);}
  .stub-rule{border:none; border-top:1px solid var(--line); margin:1px 0 0;}
  .stub-number{margin-top:auto; font-family:'Anton',sans-serif; font-size:22px; text-align:right; line-height:1;}
  .punch{
    position:absolute; width:14px; height:14px; border-radius:50%; background:var(--ink);
    left:calc(67% - 7px); z-index:2;
  }
  .punch.top{top:-7px;}
  .punch.bottom{bottom:-7px;}
  .empty-note{
    text-align:center; font-size:12.5px; color:var(--ink-soft); padding:16px 0 2px;
  }
</style>
</head>
<body>

<!--
  ================================================================
  CONEXIÓN OPCIONAL A FIREBASE (para usar la app fuera de claude.ai,
  por ejemplo en GitHub Pages, con los datos sincronizados entre
  dispositivos).

  1. Crea un proyecto gratis en https://console.firebase.google.com
  2. Dentro del proyecto: "Compilación" → "Firestore Database" → "Crear
     base de datos" (puedes empezar en modo de prueba).
  3. "Configuración del proyecto" (ícono de engranaje) → en "Tus apps"
     agrega una app Web (</>) → copia el objeto firebaseConfig que te
     muestra y pégalo abajo, reemplazando los valores de ejemplo.
  4. En Firestore → pestaña "Reglas", usa algo como esto mientras
     pruebas (cualquiera con el link puede leer/escribir — está bien
     para una rifa pequeña, pero es importante que sepas que es así):

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /{document=**} {
             allow read, write: if true;
           }
         }
       }

  5. Si dejas los valores de ejemplo tal cual (sin editarlos), esta
     parte simplemente no se activa y la app sigue funcionando como
     hasta ahora (datos guardados solo en este navegador).
  ================================================================
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyB91o1h_wcC_DQWXhs3HkXkC7przXww068",
    authDomain: "rifa-e9f76.firebaseapp.com",
    projectId: "rifa-e9f76",
    storageBucket: "rifa-e9f76.firebasestorage.app",
    messagingSenderId: "706533070370",
    appId: "1:706533070370:web:c89775706875e1896adc7b",
    measurementId: "G-C3LHXEFSLP"
  };

  var configured = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("TU_API_KEY") === -1;

  if(configured){
    try{
      var app = initializeApp(firebaseConfig);
      var fsDb = getFirestore(app);

      window.__firestoreAdapter = {
        doc: function(path){
          var ref = doc(fsDb, path);
          return {
            set: function(data){ return setDoc(ref, data); },
            delete: function(){ return deleteDoc(ref); },
            onSnapshot: function(cb, errCb){
              return onSnapshot(ref, function(snap){
                cb({ exists: snap.exists(), data: function(){ return snap.data(); }, id: snap.id });
              }, errCb);
            }
          };
        },
        collection: function(path){
          var colRef = collection(fsDb, path);
          return {
            doc: function(id){
              var ref = doc(fsDb, path, id);
              return {
                set: function(data){ return setDoc(ref, data); },
                delete: function(){ return deleteDoc(ref); }
              };
            },
            onSnapshot: function(cb, errCb){
              return onSnapshot(colRef, function(qsnap){
                cb({ docs: qsnap.docs.map(function(d){
                  return { id: d.id, data: function(){ return d.data(); } };
                }) });
              }, errCb);
            }
          };
        }
      };
    }catch(e){
      window.__firestoreAdapter = null;
      console.error("No se pudo iniciar Firebase:", e);
    }
  }
</script>

<script>
(function(){
  "use strict";

  var NUMS = [];
  for (var i=0;i<100;i++){ NUMS.push(String(i).padStart(2,'0')); }

  var DEFAULT_SETTINGS = {
    responsable: "Yeison Rodriguez",
    telefono: "3213146587",
    sorteo: "17 de octubre, Lotería de Boyacá",
    valor: 20000,
    premio: 1000000
  };

  var state = { settings: null, tickets: {} };
  var db = null, downloads = null, capabilitiesReady = false;
  var currentNum = null; // number the open modal refers to
  var payVal = "no";

  function fmt(n){
    n = Number(n)||0;
    return "$" + new Intl.NumberFormat('es-CO').format(n);
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- local fallback storage ---------------- */
  var LOCAL_KEY = "rifa-panel-v1";
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        state.settings = parsed.settings || DEFAULT_SETTINGS;
        state.tickets = parsed.tickets || {};
      } else {
        state.settings = DEFAULT_SETTINGS;
        state.tickets = {};
      }
    }catch(e){
      state.settings = DEFAULT_SETTINGS;
      state.tickets = {};
    }
  }
  function persistLocal(){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify({settings:state.settings, tickets:state.tickets}));
    }catch(e){ /* ignore */ }
  }

  /* ---------------- data layer ---------------- */
  function saveSettings(newSettings){
    if(db){
      db.doc('config/settings').set(newSettings).catch(function(){});
    } else {
      state.settings = newSettings;
      persistLocal();
      renderHero();
    }
  }
  function saveTicket(num, data){
    if(db){
      db.collection('tickets').doc(num).set(data).catch(function(){});
    } else {
      state.tickets[num] = data;
      persistLocal();
      renderGrid();
    }
  }
  function releaseTicket(num){
    if(db){
      db.collection('tickets').doc(num).delete().catch(function(){});
    } else {
      delete state.tickets[num];
      persistLocal();
      renderGrid();
    }
  }

  /* ---------------- render: hero ---------------- */
  function renderHero(){
    var s = state.settings || DEFAULT_SETTINGS;
    var meta = document.getElementById('heroMeta');
    var parts = [];
    if(s.responsable) parts.push("Responsable: " + esc(s.responsable));
    if(s.telefono) parts.push("Tel: " + esc(s.telefono));
    meta.innerHTML = parts.join(" &middot; ") + (s.sorteo ? "<br>" + esc(s.sorteo) : "");
    document.getElementById('heroPrices').innerHTML =
      '<div class="price-block"><div class="label">Valor por número</div><div class="amount">'+fmt(s.valor)+'</div></div>'+
      '<div class="price-block premio"><div class="label">Premio mayor</div><div class="amount">'+fmt(s.premio)+'</div></div>';

    document.getElementById('setResponsable').value = s.responsable||"";
    document.getElementById('setTel').value = s.telefono||"";
    document.getElementById('setSorteo').value = s.sorteo||"";
    document.getElementById('setValor').value = s.valor||0;
    document.getElementById('setPremio').value = s.premio||0;
  }

  /* ---------------- render: grid ---------------- */
  function renderGrid(){
    var grid = document.getElementById('grid');
    var html = "";
    var disponibles=0, pendientes=0, pagadas=0;
    for(var i=0;i<NUMS.length;i++){
      var num = NUMS[i];
      var t = state.tickets[num];
      var cls = "cell";
      if(t && t.pagado){ cls += " paid"; pagadas++; }
      else if(t){ cls += " pending"; pendientes++; }
      else { disponibles++; }
      html += '<button class="'+cls+'" data-num="'+num+'" aria-label="Número '+num+(t?(t.pagado?', vendido, pagado':', vendido, pendiente de pago'):', disponible')+'">'+num+'</button>';
    }
    grid.innerHTML = html;

    document.getElementById('stats').innerHTML =
      '<span class="stat-chip"><span class="dot available"></span>'+disponibles+' disponibles</span>'+
      '<span class="stat-chip"><span class="dot pending"></span>'+pendientes+' por pagar</span>'+
      '<span class="stat-chip"><span class="dot paid"></span>'+pagadas+' pagadas</span>';

    var cells = grid.querySelectorAll('.cell');
    cells.forEach(function(c){
      c.addEventListener('click', function(){
        openForNumber(this.getAttribute('data-num'));
      });
    });
  }

  /* ---------------- number flow ---------------- */
  function openForNumber(num){
    currentNum = num;
    var t = state.tickets[num];
    if(t){
      openTicketPreview(num);
    } else {
      openForm(num, null);
    }
  }

  function openForm(num, existing){
    currentNum = num;
    document.getElementById('formTitle').textContent = "Boleta N° " + num;
    document.getElementById('inpNombre').value = existing ? existing.nombre : "";
    document.getElementById('inpTelefono').value = existing ? existing.telefono : "";
    setPayToggle(existing && existing.pagado ? "si" : "no");
    document.getElementById('formMsg').textContent = "";
    document.getElementById('overlayForm').classList.add('open');
    document.getElementById('inpNombre').focus();
  }
  function closeForm(){ document.getElementById('overlayForm').classList.remove('open'); }

  function setPayToggle(val){
    payVal = val;
    document.getElementById('payNo').classList.toggle('active', val==="no");
    document.getElementById('paySi').classList.toggle('active', val==="si");
  }

  function confirmForm(){
    var nombre = document.getElementById('inpNombre').value.trim();
    var telefono = document.getElementById('inpTelefono').value.trim();
    if(!nombre){
      document.getElementById('formMsg').textContent = "Escribe el nombre del comprador para continuar.";
      document.getElementById('inpNombre').focus();
      return;
    }
    var data = { nombre: nombre, telefono: telefono, pagado: payVal==="si", actualizado: Date.now() };
    saveTicket(currentNum, data);
    // optimistic local mirror so the preview opens instantly even before the snapshot returns
    state.tickets[currentNum] = data;
    closeForm();
    openTicketPreview(currentNum);
  }

  /* ---------------- ticket preview ---------------- */
  function openTicketPreview(num){
    currentNum = num;
    var s = state.settings || DEFAULT_SETTINGS;
    var t = state.tickets[num] || {nombre:"", telefono:"", pagado:false};

    document.getElementById('tMeta').innerHTML =
      (s.responsable? "Responsable: "+esc(s.responsable)+"<br>":"") +
      (s.telefono? "Tel: "+esc(s.telefono):"") +
      (s.sorteo? '<hr class="rule">'+esc(s.sorteo):"");
    document.getElementById('tValor').textContent = fmt(s.valor);
    document.getElementById('tPremio').textContent = fmt(s.premio);
    document.getElementById('tNombre').textContent = t.nombre || "—";
    document.getElementById('tTelefono').textContent = t.telefono || "—";
    document.getElementById('tNumero').textContent = "N° " + num;
    var estadoEl = document.getElementById('tEstado');
    if(t.pagado){ estadoEl.textContent = "PAGA"; estadoEl.className="stub-status si"; }
    else { estadoEl.textContent = "NO PAGA"; estadoEl.className="stub-status no"; }

    document.getElementById('ticketMsg').textContent = "";
    document.getElementById('overlayTicket').classList.add('open');
  }
  function closeTicket(){ document.getElementById('overlayTicket').classList.remove('open'); }

  /* ---- draw the ticket straight onto a canvas (no external libs) ---- */
  var EXPORT_COLORS = {
    paper:'#FAF6EC', stub:'#ECE0C8', ink:'#211D17', inkSoft:'#6B6255',
    gold:'#B9862E', goldSoft:'#F3E4C2', green:'#3B6B4C', greenSoft:'#DCE9DD'
  };
  function seededRandom(seed){ var x = Math.sin(seed)*10000; return x - Math.floor(x); }
  function wrapCanvasText(ctx, text, maxWidth, maxLines){
    var words = String(text||"").split(/\s+/).filter(Boolean);
    var lines = []; var cur = "";
    for(var i=0;i<words.length;i++){
      var test = cur ? cur+" "+words[i] : words[i];
      if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = words[i]; }
      else { cur = test; }
      if(maxLines && lines.length >= maxLines){ break; }
    }
    if(cur && (!maxLines || lines.length < maxLines)) lines.push(cur);
    if(maxLines && lines.length > maxLines){ lines = lines.slice(0,maxLines); }
    return lines;
  }
  function roundedRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function buildTicketCanvas(num){
    var s = state.settings || DEFAULT_SETTINGS;
    var t = state.tickets[num] || {nombre:"", telefono:"", pagado:false};
    var C = EXPORT_COLORS;
    var W = 760, H = 270, SCALE = 3;
    var infoW = Math.round(W*0.38);          // section 1
    var stubW = Math.round(W*0.33);          // section 3
    var dividerX = W - stubW;                // between section 2 and 3
    var pricesX = infoW;                     // between section 1 and 2

    var canvas = document.createElement('canvas');
    canvas.width = W*SCALE; canvas.height = H*SCALE;
    var ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);
    ctx.textBaseline = 'alphabetic';

    // base
    ctx.fillStyle = C.paper; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = C.stub; ctx.fillRect(dividerX,0,stubW,H);
    ctx.strokeStyle = 'rgba(33,29,23,0.18)'; ctx.lineWidth = 1;
    ctx.strokeRect(0.5,0.5,W-1,H-1);

    // rule between section 1 and 2
    ctx.strokeStyle = 'rgba(33,29,23,0.20)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pricesX+0.5, 22); ctx.lineTo(pricesX+0.5, H-22); ctx.stroke();

    // dashed divider between section 2 and 3
    ctx.save();
    ctx.setLineDash([6,6]);
    ctx.strokeStyle = C.inkSoft; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dividerX,14); ctx.lineTo(dividerX,H-14); ctx.stroke();
    ctx.restore();

    // punches
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(dividerX,10,11,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(dividerX,H-10,11,0,Math.PI*2); ctx.fill();

    /* ---------- SECTION 1 — datos de la rifa ---------- */
    var iPad = 20, iW = infoW - iPad - 12;
    var iCenterX = iPad + iW/2;

    // measure the meta block first so we can center the whole group (brand + meta)
    ctx.font = '400 11.5px Inter, sans-serif';
    var lines = [];
    if(s.responsable) lines = lines.concat(wrapCanvasText(ctx, 'Responsable: ' + s.responsable, iW, 2));
    if(s.telefono) lines.push('Tel: ' + s.telefono);
    var sorteoLines = s.sorteo ? wrapCanvasText(ctx, s.sorteo, iW, 3) : [];
    var lineH = 16;
    var metaH = lines.length*lineH + (sorteoLines.length ? 14 + sorteoLines.length*lineH : 0);

    ctx.font = '400 62px Anton, sans-serif';
    var brandTxt = 'Rifa';
    while(ctx.measureText(brandTxt).width > iW && parseInt(ctx.font,10) > 26){
      ctx.font = '400 ' + (parseInt(ctx.font,10)-2) + 'px Anton, sans-serif';
    }
    var brandSize = parseInt(ctx.font,10);
    var brandH = brandSize * 0.72;
    var gap = 14;
    var groupH = brandH + gap + metaH;
    var top = (H - groupH) / 2;

    ctx.textAlign = 'center';
    ctx.fillStyle = C.ink;
    ctx.fillText(brandTxt, iCenterX, top + brandH);
    ctx.textAlign = 'left';

    var y = top + brandH + gap + lineH*0.7;
    ctx.font = '400 11.5px Inter, sans-serif';
    ctx.fillStyle = C.inkSoft;
    ctx.textAlign = 'center';
    lines.forEach(function(l){ ctx.fillText(l, iCenterX, y); y += lineH; });
    if(sorteoLines.length){
      y += 4;
      ctx.strokeStyle = 'rgba(33,29,23,0.20)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(iPad, y-10); ctx.lineTo(iPad+iW, y-10); ctx.stroke();
      y += 8;
      sorteoLines.forEach(function(l){ ctx.fillText(l, iCenterX, y); y += lineH; });
    }
    ctx.textAlign = 'left';

    /* ---------- SECTION 2 — valores ---------- */
    var midX = pricesX + (dividerX - pricesX)/2;
    var midW = (dividerX - pricesX) - 28;
    ctx.textAlign = 'center';

    ctx.font = '700 10.5px Inter, sans-serif';
    ctx.fillStyle = C.inkSoft;
    ctx.fillText('VALOR POR NÚMERO', midX, H/2 - 44);
    ctx.fillStyle = C.ink;
    ctx.font = '400 32px Anton, sans-serif';
    var valorTxt = fmt(s.valor);
    while(ctx.measureText(valorTxt).width > midW && parseInt(ctx.font,10) > 16){
      ctx.font = '400 ' + (parseInt(ctx.font,10)-2) + 'px Anton, sans-serif';
    }
    ctx.fillText(valorTxt, midX, H/2 - 12);

    ctx.font = '700 10.5px Inter, sans-serif';
    ctx.fillStyle = C.inkSoft;
    ctx.fillText('PREMIO MAYOR', midX, H/2 + 30);
    ctx.fillStyle = C.gold;
    ctx.font = '400 36px Anton, sans-serif';
    var premioTxt = fmt(s.premio);
    while(ctx.measureText(premioTxt).width > midW && parseInt(ctx.font,10) > 16){
      ctx.font = '400 ' + (parseInt(ctx.font,10)-2) + 'px Anton, sans-serif';
    }
    ctx.fillText(premioTxt, midX, H/2 + 66);
    ctx.textAlign = 'left';

    /* ---------- SECTION 3 — comprador ---------- */
    var sx = dividerX + 20, sw = stubW - 38;

    // barcode
    var by = 24, bh = 26, cx = sx;
    var seed = 0; for(var k=0;k<num.length;k++){ seed += num.charCodeAt(k)*(k+3); }
    ctx.fillStyle = C.ink;
    while(cx < sx+sw){
      var r = seededRandom(seed + cx);
      var barW = 1.4 + r*2.6;
      if(r > 0.33){ ctx.fillRect(cx, by, Math.min(barW, sx+sw-cx), bh); }
      cx += barW + 1.4 + seededRandom(seed+cx+1)*1.8;
    }

    // nombre
    var ny = 74;
    ctx.font = '700 9.5px Inter, sans-serif';
    ctx.fillStyle = C.inkSoft;
    ctx.fillText('NOMBRE', sx, ny);
    ctx.fillStyle = C.ink;
    ctx.font = '700 14px Inter, sans-serif';
    var nombreLines = wrapCanvasText(ctx, t.nombre || '—', sw, 2);
    if(nombreLines.length === 1 && ctx.measureText(nombreLines[0]).width > sw){
      ctx.font = '700 12px Inter, sans-serif';
      nombreLines = wrapCanvasText(ctx, t.nombre || '—', sw, 2);
    }
    var nly = ny + 18;
    nombreLines.forEach(function(l){ ctx.fillText(l, sx, nly); nly += 17; });

    // estado
    var estadoY = nly + 4;
    var estadoTxt = t.pagado ? 'PAGA' : 'NO PAGA';
    ctx.font = '800 10px Inter, sans-serif';
    var badgeW = ctx.measureText(estadoTxt).width + 18;
    roundedRectPath(ctx, sx, estadoY, badgeW, 19, 9.5);
    ctx.fillStyle = t.pagado ? C.greenSoft : C.goldSoft;
    ctx.fill();
    ctx.fillStyle = t.pagado ? C.green : C.gold;
    ctx.fillText(estadoTxt, sx+9, estadoY+13);

    // telefono
    var telY = estadoY + 42;
    ctx.font = '700 9.5px Inter, sans-serif';
    ctx.fillStyle = C.inkSoft;
    ctx.fillText('TELÉFONO', sx, telY);
    ctx.font = '700 14px Inter, sans-serif';
    ctx.fillStyle = C.ink;
    ctx.fillText(t.telefono || '—', sx, telY+18);

    // rule + numero
    ctx.strokeStyle = 'rgba(33,29,23,0.20)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, H-56); ctx.lineTo(sx+sw, H-56); ctx.stroke();
    ctx.font = '400 34px Anton, sans-serif';
    ctx.fillStyle = C.ink;
    ctx.textAlign = 'right';
    ctx.fillText('N° ' + num, sx+sw, H-20);
    ctx.textAlign = 'left';

    return canvas;
  }

  function downloadTicket(){
    var msg = document.getElementById('ticketMsg');
    var num = currentNum;
    msg.textContent = "Generando imagen…";

    var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    var fontLoads = document.fonts ? Promise.all([
      document.fonts.load('400 62px Anton'),
      document.fonts.load('400 36px Anton'),
      document.fonts.load('400 34px Anton'),
        document.fonts.load('400 32px Anton'),
      document.fonts.load('700 14px Inter'),
      document.fonts.load('800 10px Inter'),
      document.fonts.load('400 11.5px Inter'),
        document.fonts.load('700 10.5px Inter')
    ]).catch(function(){}) : Promise.resolve();

    Promise.all([fontsReady, fontLoads]).then(function(){
      var canvas;
      try{
        canvas = buildTicketCanvas(num);
      }catch(e){
        msg.textContent = "No se pudo generar la imagen. Intenta de nuevo.";
        return;
      }
      canvas.toBlob(function(blob){
        if(!blob){ msg.textContent = "No se pudo generar la imagen."; return; }
        var filename = "boleta-" + num + ".jpg";
        if(downloads){
          downloads.save({filename: filename, data: blob}).then(function(){
            msg.textContent = "Boleta guardada.";
          }).catch(function(err){
            if(err && err.code === "declined"){ msg.textContent = "Descarga cancelada."; }
            else { fallbackDownload(blob, filename, msg); }
          });
        } else {
          fallbackDownload(blob, filename, msg);
        }
      }, 'image/jpeg', 0.95);
    });
  }
  function fallbackDownload(blob, filename, msg){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      msg.textContent = "Boleta guardada.";
    }catch(e){
      msg.textContent = "No se pudo descargar aquí. Mantén presionada la boleta para guardarla.";
    }
  }

  function releaseCurrent(){
    if(!currentNum) return;
    releaseTicket(currentNum);
    delete state.tickets[currentNum];
    closeTicket();
    renderGrid();
  }

  /* ---------------- settings modal ---------------- */
  function openSettings(){ document.getElementById('overlaySettings').classList.add('open'); }
  function closeSettings(){ document.getElementById('overlaySettings').classList.remove('open'); }
  function saveSettingsForm(){
    var newSettings = {
      responsable: document.getElementById('setResponsable').value.trim(),
      telefono: document.getElementById('setTel').value.trim(),
      sorteo: document.getElementById('setSorteo').value.trim(),
      valor: Number(document.getElementById('setValor').value)||0,
      premio: Number(document.getElementById('setPremio').value)||0
    };
    saveSettings(newSettings);
    state.settings = newSettings;
    renderHero();
    closeSettings();
  }

  /* ---------------- wire up ---------------- */
  function wire(){
    document.getElementById('btnSettings').addEventListener('click', openSettings);
    document.getElementById('closeSettings').addEventListener('click', closeSettings);
    document.getElementById('btnSaveSettings').addEventListener('click', saveSettingsForm);

    document.getElementById('closeForm').addEventListener('click', closeForm);
    document.getElementById('btnConfirm').addEventListener('click', confirmForm);
    document.getElementById('payNo').addEventListener('click', function(){ setPayToggle('no'); });
    document.getElementById('paySi').addEventListener('click', function(){ setPayToggle('si'); });

    document.getElementById('closeTicket').addEventListener('click', closeTicket);
    document.getElementById('btnDownload').addEventListener('click', downloadTicket);
    document.getElementById('btnRelease').addEventListener('click', releaseCurrent);
    document.getElementById('btnEditTicket').addEventListener('click', function(){
      closeTicket();
      openForm(currentNum, state.tickets[currentNum]);
    });

    [ 'overlayForm','overlayTicket','overlaySettings' ].forEach(function(id){
      document.getElementById(id).addEventListener('click', function(e){
        if(e.target === this){ this.classList.remove('open'); }
      });
    });
  }

  /* ---------------- capability init ---------------- */
  var storageMode = 'local'; // 'claude' | 'firebase' | 'local'

  async function initCapabilities(){
    try{
      if(typeof window.claude !== 'undefined' && window.claude && typeof window.claude.use === 'function'){
        db = await window.claude.use('db');
        downloads = await window.claude.use('downloads');
        if(db) storageMode = 'claude';
      }
    }catch(e){ db = null; downloads = null; }

    if(!db && window.__firestoreAdapter){
      db = window.__firestoreAdapter;
      storageMode = 'firebase';
    }
    capabilitiesReady = true;

    var note = document.getElementById('localNote');
    if(db){
      if(storageMode === 'firebase'){
        note.textContent = 'Sincronizado con Firebase: los datos se comparten entre dispositivos.';
        note.style.display = 'block';
      } else {
        note.style.display = 'none';
      }
      db.doc('config/settings').onSnapshot(function(snap){
        state.settings = snap.exists ? snap.data() : DEFAULT_SETTINGS;
        if(!snap.exists){ db.doc('config/settings').set(DEFAULT_SETTINGS).catch(function(){}); }
        renderHero();
      }, function(){ state.settings = state.settings || DEFAULT_SETTINGS; renderHero(); });

      db.collection('tickets').onSnapshot(function(qsnap){
        var map = {};
        qsnap.docs.forEach(function(d){ map[d.id] = d.data(); });
        state.tickets = map;
        renderGrid();
      }, function(){ renderGrid(); });
    } else {
      note.textContent = 'Los datos se guardan en este navegador. Si borras los datos del navegador o usas otro dispositivo, la información no estará ahí.';
      note.style.display = 'block';
      loadLocal();
      renderHero();
      renderGrid();
    }
  }

  document.addEventListener('DOMContentLoaded', function(){
    // render immediately with defaults so the page never looks blank
    state.settings = DEFAULT_SETTINGS;
    renderHero();
    renderGrid();
    wire();
    initCapabilities();
  });
})();
</script>
</body>
</html>
